name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: Build and validate API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Configure documentation
        run: >-
          cmake -S . -B out/build-docs
          -DPJSON_BUILD_TESTS=OFF
          -DPJSON_BUILD_EXAMPLES=OFF
          -DPJSON_BUILD_BENCHMARKS=OFF
          -DPJSON_BUILD_DOCS=ON

      - name: Build and validate documentation
        run: cmake --build out/build-docs --target pjson-docs-check

      - name: Upload browsable reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pjson-api-reference
          path: out/build-docs/docs/reference/html
          if-no-files-found: error

      - name: Prepare GitHub Pages artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/build-docs/docs/reference/html

  pages:
    name: Publish API reference to GitHub Pages
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: reference
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release-archive:
    name: Attach API reference to release
    if: github.event_name == 'release'
    needs: reference
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pjson-api-reference
          path: reference-html

      - name: Package release documentation
        run: |
          tar -C reference-html -czf pjson-api-reference.tar.gz .
          sha256sum pjson-api-reference.tar.gz > pjson-api-reference.tar.gz.sha256

      - name: Attach documentation archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            pjson-api-reference.tar.gz \
            pjson-api-reference.tar.gz.sha256 \
            --repo "${GITHUB_REPOSITORY}"
