name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: Build and validate API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Configure documentation
        run: >-
          cmake -S . -B out/build-docs
          -DPJSON_BUILD_TESTS=OFF
          -DPJSON_BUILD_EXAMPLES=OFF
          -DPJSON_BUILD_BENCHMARKS=OFF
          -DPJSON_BUILD_DOCS=ON

      - name: Build and validate documentation
        run: cmake --build out/build-docs --target pjson-docs-check

      - name: Upload browsable reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pjson-api-reference
          path: out/build-docs/docs/reference/html
          if-no-files-found: error

      - name: Prepare GitHub Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: pages-artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out/build-docs/docs/reference/html

  pages:
    name: Publish API reference to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: reference
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  release-archive:
    name: Attach API reference to release
    if: github.event_name == 'release'
    needs: reference
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated reference
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pjson-api-reference
          path: reference-html

      - name: Package release documentation
        run: tar -C reference-html -czf pjson-api-reference.tar.gz .

      - name: Attach documentation archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "${RELEASE_TAG}"
          pjson-api-reference.tar.gz
